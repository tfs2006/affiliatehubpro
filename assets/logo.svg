<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" role="img" aria-labelledby="title desc">
  <title id="title">Affiliate Hub Pro logo</title>
  <desc id="desc">Affiliate Hub Pro logo: orange game badge with rising bars, gold arrow and coin, plus wordmark.</desc>
  <defs>
    <linearGradient id="lgTile" x1="18" y1="18" x2="162" y2="162" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#D9481F"/>
    </linearGradient>
    <linearGradient id="lgCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#FFF1E2"/>
    </linearGradient>
    <linearGradient id="lgTeal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1FC2BB"/>
      <stop offset="1" stop-color="#0B6E6B"/>
    </linearGradient>
    <linearGradient id="lgArrow" x1="30" y1="110" x2="140" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2682A"/>
      <stop offset="1" stop-color="#F7B32B"/>
    </linearGradient>
    <linearGradient id="lgCoin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD97A"/>
      <stop offset="1" stop-color="#F0A118"/>
    </linearGradient>
    <filter id="lgShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#7A1F0E" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="640" height="180" rx="32" fill="none"/>
  <!-- Badge -->
  <g transform="translate(18 18)" filter="url(#lgShadow)">
    <rect width="144" height="144" rx="36" fill="url(#lgTile)"/>
    <rect x="20" y="26" width="104" height="92" rx="24" fill="url(#lgCard)"/>
    <rect x="36" y="70" width="16" height="30" rx="8" fill="#E5DACA"/>
    <rect x="58" y="58" width="16" height="42" rx="8" fill="url(#lgTeal)"/>
    <rect x="80" y="72" width="16" height="28" rx="8" fill="#E5DACA"/>
    <path d="M36 74 C 52 64, 64 66, 78 56 C 90 48, 98 40, 110 38" fill="none" stroke="#ffffff" stroke-width="15" stroke-linecap="round"/>
    <path d="M98 30 H114 V46" fill="none" stroke="#ffffff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M36 74 C 52 64, 64 66, 78 56 C 90 48, 98 40, 110 38" fill="none" stroke="url(#lgArrow)" stroke-width="9" stroke-linecap="round"/>
    <path d="M98 30 H114 V46" fill="none" stroke="url(#lgArrow)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="118" cy="26" r="17" fill="url(#lgCoin)" stroke="#ffffff" stroke-width="4"/>
    <text x="118" y="33" text-anchor="middle" font-family="'Space Grotesk',Arial,'DejaVu Sans',sans-serif" font-size="17" font-weight="700" fill="#7A4A00">$</text>
    <rect x="34" y="126" width="76" height="10" rx="5" fill="#7A1F0E" fill-opacity="0.3"/>
    <rect x="34" y="126" width="52" height="10" rx="5" fill="#FFE3A8"/>
  </g>
  <!-- Wordmark -->
  <g transform="translate(186 30)">
    <text x="0" y="24" font-family="'Space Grotesk',Arial,'DejaVu Sans',sans-serif" font-size="21" font-weight="700" letter-spacing="2" fill="#0B6E6B">AFFILIATE HUB PRO</text>
    <text x="0" y="76" font-family="'Space Grotesk','Trebuchet MS',Arial,sans-serif" font-size="38" font-weight="700" letter-spacing="-1" fill="#16232A">Affiliate Marketing</text>
    <text x="0" y="116" font-family="'Space Grotesk','Trebuchet MS',Arial,sans-serif" font-size="35" font-weight="700" letter-spacing="-1" fill="#16232A">Simulator</text>
    <rect x="0" y="128" width="330" height="30" rx="15" fill="#FFF4E2" stroke="#F0A118" stroke-opacity="0.45"/>
    <circle cx="20" cy="143" r="6" fill="#F2682A"/>
    <text x="32" y="149" font-family="'IBM Plex Sans',Arial,'DejaVu Sans',sans-serif" font-size="16" font-weight="600" fill="#6B5B3E">Offers · Traffic · Trust · EPC</text>
  </g>
</svg>
