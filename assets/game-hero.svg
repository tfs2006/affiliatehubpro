<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
  <title id="title">Affiliate Hub Pro game board</title>
  <desc id="desc">Gamified dashboard: player level with XP bar, coin and streak pills, stat cards for offer fit, trust and EPC, traffic mix bars, daily quests, and a best-channel trophy.</desc>
  <defs>
    <linearGradient id="ghBg" x1="60" y1="30" x2="900" y2="690" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF9EF"/>
      <stop offset="1" stop-color="#F3E3CB"/>
    </linearGradient>
    <linearGradient id="ghOrange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2682A"/>
      <stop offset="1" stop-color="#F7B32B"/>
    </linearGradient>
    <linearGradient id="ghTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B6E6B"/>
      <stop offset="1" stop-color="#1FC2BB"/>
    </linearGradient>
    <linearGradient id="ghGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE9B8"/>
      <stop offset="1" stop-color="#F7B32B"/>
    </linearGradient>
    <linearGradient id="ghTrophy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD97A"/>
      <stop offset="1" stop-color="#F0A118"/>
    </linearGradient>
    <filter id="ghShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#8A5A26" flood-opacity="0.18"/>
    </filter>
    <filter id="ghSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#8A5A26" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="960" height="720" rx="36" fill="url(#ghBg)"/>
  <circle cx="110" cy="90" r="110" fill="#F2682A" fill-opacity="0.07"/>
  <circle cx="870" cy="640" r="130" fill="#0B6E6B" fill-opacity="0.07"/>
  <g fill="#8A5A26" opacity="0.12">
    <circle cx="60" cy="660" r="6"/><circle cx="84" cy="660" r="6"/><circle cx="108" cy="660" r="6"/>
    <circle cx="880" cy="60" r="6"/><circle cx="904" cy="60" r="6"/><circle cx="880" cy="84" r="6"/><circle cx="904" cy="84" r="6"/>
  </g>

  <!-- ===== HUD bar ===== -->
  <g filter="url(#ghShadow)">
    <rect x="48" y="44" width="864" height="104" rx="30" fill="#ffffff"/>
  </g>
  <!-- Level shield -->
  <g transform="translate(112 96)">
    <path d="M0 -34 L28 -22 V4 C28 22 12 30 0 36 C-12 30 -28 22 -28 4 V-22 Z" fill="url(#ghTeal)"/>
    <path d="M0 -34 L28 -22 V4 C28 22 12 30 0 36 C-12 30 -28 22 -28 4 V-22 Z" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
    <text x="0" y="13" text-anchor="middle" font-family="'Space Grotesk',Arial,'DejaVu Sans',sans-serif" font-size="34" font-weight="700" fill="#ffffff">5</text>
  </g>
  <text x="158" y="90" font-family="'Space Grotesk',Arial,'DejaVu Sans',sans-serif" font-size="22" font-weight="700" letter-spacing="1.5" fill="#16232A">LEVEL 5</text>
  <text x="158" y="132" font-family="'IBM Plex Sans',Arial,'DejaVu Sans',sans-serif" font-size="17" font-weight="600" fill="#7A8791">2,450 / 3,000 XP</text>
  <rect x="330" y="106" width="240" height="24" rx="12" fill="#EFE6D4"/>
  <rect x="330" y="106" width="173" height="24" rx="12" fill="url(#ghOrange)"/>
  <rect x="338" y="110" width="120" height="6" rx="3" fill="#ffffff" fill-opacity="0.5"/>
  <text x="416" y="124" text-anchor="middle" font-family="'IBM Plex Sans',Arial,'DejaVu Sans',sans-serif" font-size="15" font-weight="700" fill="#ffffff">72%</text>

  <!-- Coin pill -->
  <g filter="url(#ghSoft)">
    <rect x="606" y="70" width="150" height="52" rx="26" fill="#FFF4D9" stroke="#F0A118" stroke-opacity="0.5" stroke-width="2"/>
  </g>
  <circle cx="636" cy="96" r="17" fill="url(#ghGold)" stroke="#C77F0A" stroke-width="2"/>
  <text x="636" y="103" text-anchor="middle" font-family="'Space Grotesk',Arial,'DejaVu Sans',sans-serif" font-size="19" font-weight="700" fill="#7A4A00">$</text>
  <text x="662" y="104" font-family="'Space Grotesk',Arial,'DejaVu Sans',sans-serif" font-size="22" font-weight="700" fill="#16232A">+$248</text>
  <!-- Streak pill -->
  <g filter="url(#ghSoft)">
    <rect x="768" y="70" width="120" height="52" rx="26" fill="#FFEDE4" stroke="#F2682A" stroke-opacity="0.4" stroke-width="2"/>
  </g>
  <g transform="translate(796 96)">
    <path d="M0 -18 C 8 -8, 13 -3, 13 5 A13 13 0 1 1 -13 5 C-13 -3 -7 -6 -4 -12 C-2 -8 0 -7 0 -3 C1 -7 -2 -12 0 -18 Z" fill="#F2682A"/>
    <path d="M0 -6 C 4 -1, 6 1, 6 5 A6 6 0 1 1 -6 5 C-6 1 -3 0 -2 -3 C-1 -1 0 -1 0 1 C1 -1 -1 -3 0 -6 Z" fill="#FFD97A"/>
  </g>
  <text x="818" y="104" font-family="'Space Grotesk',Arial,'DejaVu Sans',sans-serif" font-size="22" font-weight="700" fill="#16232A">×3</text>

  <!-- ===== Stat cards ===== -->
  <g font-family="'Space Grotesk',Arial,'DejaVu Sans',sans-serif">
    <!-- Offer Fit -->
    <g filter="url(#ghShadow)">
      <rect x="48" y="172" width="272" height="148" rx="26" fill="#ffffff"/>
    </g>
    <rect x="252" y="192" width="48" height="48" rx="14" fill="url(#ghOrange)"/>
    <g transform="translate(276 216)" stroke="#ffffff" stroke-width="4" fill="none">
      <circle r="12"/><circle r="4.5" fill="#ffffff" stroke="none"/>
    </g>
    <text x="72" y="212" font-size="18" font-weight="700" letter-spacing="1.5" fill="#7A8791">OFFER FIT</text>
    <text x="70" y="284" font-size="58" font-weight="700" fill="#16232A">124</text>
    <rect x="196" y="252" width="100" height="36" rx="18" fill="#E3F4F1"/>
    <text x="246" y="277" text-anchor="middle" font-size="19" font-weight="700" fill="#0B6E6B">+12%</text>

    <!-- Trust -->
    <g filter="url(#ghShadow)">
      <rect x="344" y="172" width="272" height="148" rx="26" fill="#ffffff"/>
    </g>
    <rect x="548" y="192" width="48" height="48" rx="14" fill="url(#ghTeal)"/>
    <g transform="translate(572 216)">
      <path d="M0 -13 L11 -8 V1 C11 9 5 12 0 14 C-5 12 -11 9 -11 1 V-8 Z" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
      <path d="M-4 1 L-1 4 L5 -3" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="368" y="212" font-size="18" font-weight="700" letter-spacing="1.5" fill="#7A8791">TRUST</text>
    <text x="366" y="284" font-size="58" font-weight="700" fill="#16232A">68</text>
    <rect x="492" y="252" width="100" height="36" rx="18" fill="#E3F4F1"/>
    <text x="542" y="277" text-anchor="middle" font-size="19" font-weight="700" fill="#0B6E6B">+5</text>

    <!-- EPC -->
    <g filter="url(#ghShadow)">
      <rect x="640" y="172" width="272" height="148" rx="26" fill="#ffffff"/>
    </g>
    <rect x="844" y="192" width="48" height="48" rx="14" fill="url(#ghGold)"/>
    <text x="868" y="226" text-anchor="middle" font-size="28" font-weight="700" fill="#7A4A00">$</text>
    <text x="664" y="212" font-size="18" font-weight="700" letter-spacing="1.5" fill="#7A8791">EPC</text>
    <rect x="722" y="190" width="110" height="34" rx="17" fill="#E3F4F1"/>
    <text x="777" y="214" text-anchor="middle" font-size="19" font-weight="700" fill="#0B6E6B">+$0.84</text>
    <text x="662" y="284" font-size="54" font-weight="700" fill="#16232A">$3.42</text>
  </g>

  <!-- ===== Traffic mix panel ===== -->
  <g filter="url(#ghShadow)">
    <rect x="48" y="344" width="560" height="328" rx="30" fill="#ffffff"/>
  </g>
  <text x="80" y="392" font-family="'Space Grotesk',Arial,'DejaVu Sans',sans-serif" font-size="26" font-weight="700" fill="#16232A">Traffic Mix</text>
  <circle cx="262" cy="383" r="8" fill="#22A06B"/>
  <text x="278" y="391" font-family="'IBM Plex Sans',Arial,'DejaVu Sans',sans-serif" font-size="16" font-weight="700" letter-spacing="1.5" fill="#22A06B">LIVE</text>

  <g font-family="'IBM Plex Sans',Arial,'DejaVu Sans',sans-serif">
    <!-- Search -->
    <circle cx="104" cy="440" r="24" fill="#E3F4F1"/>
    <g transform="translate(104 440)" stroke="#0B6E6B" stroke-width="4.5" fill="none" stroke-linecap="round">
      <circle cx="-3" cy="-3" r="9"/><path d="M4 4 L12 12"/>
    </g>
    <text x="140" y="449" font-size="22" font-weight="700" fill="#16232A">Search</text>
    <rect x="292" y="426" width="196" height="26" rx="13" fill="#EFE6D4"/>
    <rect x="292" y="426" width="133" height="26" rx="13" fill="url(#ghTeal)"/>
    <text x="508" y="449" font-size="22" font-weight="700" fill="#16232A">68%</text>
    <!-- Email -->
    <circle cx="104" cy="516" r="24" fill="#FFEDE4"/>
    <g transform="translate(104 516)">
      <rect x="-13" y="-9" width="26" height="18" rx="4" fill="none" stroke="#D9481F" stroke-width="4"/>
      <path d="M-13 -7 L0 3 L13 -7" fill="none" stroke="#D9481F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="140" y="525" font-size="22" font-weight="700" fill="#16232A">Email</text>
    <rect x="292" y="502" width="196" height="26" rx="13" fill="#EFE6D4"/>
    <rect x="292" y="502" width="88" height="26" rx="13" fill="url(#ghOrange)"/>
    <text x="508" y="525" font-size="22" font-weight="700" fill="#16232A">45%</text>
    <!-- Community -->
    <circle cx="104" cy="592" r="24" fill="#FFF4D9"/>
    <g transform="translate(104 592)">
      <rect x="-14" y="-11" width="28" height="20" rx="10" fill="none" stroke="#C77F0A" stroke-width="4"/>
      <path d="M-4 9 L-8 16 L0 9" fill="none" stroke="#C77F0A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="-6" cy="-1" r="2.6" fill="#C77F0A"/><circle cx="1" cy="-1" r="2.6" fill="#C77F0A"/><circle cx="8" cy="-1" r="2.6" fill="#C77F0A"/>
    </g>
    <text x="140" y="601" font-size="22" font-weight="700" fill="#16232A">Community</text>
    <rect x="292" y="578" width="196" height="26" rx="13" fill="#EFE6D4"/>
    <rect x="292" y="578" width="63" height="26" rx="13" fill="#F0A118"/>
    <text x="508" y="601" font-size="22" font-weight="700" fill="#16232A">32%</text>
  </g>

  <!-- ===== Quests card ===== -->
  <g filter="url(#ghShadow)">
    <rect x="632" y="344" width="280" height="192" rx="30" fill="#0E2A30"/>
  </g>
  <text x="660" y="384" font-family="'Space Grotesk',Arial,'DejaVu Sans',sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#7CF0D4">TODAY'S QUESTS</text>
  <g font-family="'IBM Plex Sans',Arial,'DejaVu Sans',sans-serif" font-size="20" font-weight="600" fill="#EDF5F3">
    <circle cx="678" cy="414" r="13" fill="#22A06B"/>
    <path d="M672 414 L677 419 L685 409" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="700" y="421">Pick an offer</text>
    <circle cx="678" cy="456" r="13" fill="#22A06B"/>
    <path d="M672 456 L677 461 L685 451" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="700" y="463">Publish 1 post</text>
    <circle cx="678" cy="498" r="13" fill="none" stroke="#5D6B73" stroke-width="3.5"/>
    <g transform="translate(678 498)" stroke="#8A9AA3" stroke-width="2.6" fill="none">
      <rect x="-5.5" y="-1" width="11" height="8" rx="2"/>
      <path d="M-3.5 -1 V-4 a3.5 3.5 0 0 1 7 0 V-1"/>
    </g>
    <text x="700" y="505" fill="#8A9AA3">Hit a $100 day</text>
  </g>

  <!-- ===== Trophy card ===== -->
  <g filter="url(#ghShadow)">
    <rect x="632" y="552" width="280" height="120" rx="30" fill="url(#ghTrophy)"/>
  </g>
  <rect x="632" y="552" width="280" height="120" rx="30" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2"/>
  <g transform="translate(684 612)">
    <path d="M-20 -24 H20 V-8 C20 4 10 10 0 10 C-10 10 -20 4 -20 -8 Z" fill="#7A4A00"/>
    <path d="M-20 -20 C-30 -20 -32 -12 -24 -8 M20 -20 C30 -20 32 -12 24 -8" fill="none" stroke="#7A4A00" stroke-width="4" stroke-linecap="round"/>
    <rect x="-3" y="10" width="6" height="8" fill="#7A4A00"/>
    <rect x="-12" y="18" width="24" height="6" rx="3" fill="#7A4A00"/>
    <path d="M0 -16 l2.2 4.4 4.9 0.7 -3.5 3.5 0.8 4.9 -4.4 -2.3 -4.4 2.3 0.8 -4.9 -3.5 -3.5 4.9 -0.7 z" fill="#FFE9B8"/>
  </g>
  <text x="724" y="596" font-family="'IBM Plex Sans',Arial,'DejaVu Sans',sans-serif" font-size="17" font-weight="700" letter-spacing="1" fill="#7A4A00">BEST CHANNEL</text>
  <text x="720" y="632" font-family="'Space Grotesk',Arial,'DejaVu Sans',sans-serif" font-size="25" font-weight="700" fill="#3D2A00">Search · 68%</text>

  <!-- Sparkles -->
  <path d="M928 200 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 z" fill="#F0A118"/>
  <path d="M36 336 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z" fill="#F2682A" opacity="0.7"/>
  <path d="M620 690 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z" fill="#0B6E6B" opacity="0.6"/>
</svg>
