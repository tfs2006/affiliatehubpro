<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="twTitle twDesc">
  <title id="twTitle">Affiliate Hub Pro — free affiliate marketing simulator game</title>
  <desc id="twDesc">Wide dark gamified card: headline, play-free call to action, and a floating game dashboard with earnings, level, and streak.</desc>
  <defs>
    <linearGradient id="twBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A2226"/>
      <stop offset="0.6" stop-color="#0D3233"/>
      <stop offset="1" stop-color="#104644"/>
    </linearGradient>
    <radialGradient id="twGlowGold" cx="0.9" cy="0.1" r="0.55">
      <stop offset="0" stop-color="#F7B32B" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#F7B32B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="twGlowTeal" cx="0.06" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#1FC2BB" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1FC2BB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="twGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFC95C"/>
      <stop offset="1" stop-color="#F0A118"/>
    </linearGradient>
    <linearGradient id="twOrange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2682A"/>
      <stop offset="1" stop-color="#F7B32B"/>
    </linearGradient>
    <linearGradient id="twTeal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1FC2BB"/>
      <stop offset="1" stop-color="#0B6E6B"/>
    </linearGradient>
    <pattern id="twGrid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0 H0 V56" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5"/>
    </pattern>
    <filter id="twCard" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="twBtn" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#F0A118" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1600" height="800" fill="url(#twBg)"/>
  <rect width="1600" height="800" fill="url(#twGlowGold)"/>
  <rect width="1600" height="800" fill="url(#twGlowTeal)"/>
  <rect width="1600" height="800" fill="url(#twGrid)"/>
  <circle cx="1500" cy="60" r="280" fill="#17413D"/>

  <!-- Eyebrow -->
  <rect x="96" y="92" width="562" height="56" rx="28" fill="none" stroke="#F7B32B" stroke-opacity="0.65" stroke-width="3"/>
  <circle cx="134" cy="120" r="10" fill="#F7B32B"/>
  <text x="156" y="129" font-family="'Space Grotesk',Arial,'DejaVu Sans',sans-serif" font-size="25" font-weight="700" letter-spacing="2" fill="#F7B32B">FREE SIMULATOR · NO SIGNUP</text>

  <!-- Headline -->
  <g font-family="'Space Grotesk','Trebuchet MS',Arial,'DejaVu Sans',sans-serif" font-weight="700" fill="#F2F7F5">
    <text x="92" y="300" font-size="80">Build your empire.</text>
    <text x="92" y="396" font-size="80">Not your ad bill.</text>
  </g>
  <text x="96" y="470" font-family="'IBM Plex Sans',Arial,'DejaVu Sans',sans-serif" font-size="31" fill="#A8CDC3">$750 virtual cash. Your strategy.</text>
  <text x="96" y="514" font-family="'IBM Plex Sans',Arial,'DejaVu Sans',sans-serif" font-size="31" fill="#A8CDC3">How far can you go?</text>

  <!-- CTA -->
  <g filter="url(#twBtn)">
    <rect x="96" y="556" width="524" height="84" rx="24" fill="url(#twGold)"/>
  </g>
  <path d="M140 582 L170 598 L140 614 Z" fill="#102d2b"/>
  <text x="188" y="610" font-family="'Space Grotesk',Arial,'DejaVu Sans',sans-serif" font-size="29" font-weight="700" fill="#102d2b">Play free. Beat a friend.</text>

  <text x="96" y="706" font-family="'IBM Plex Sans',Arial,'DejaVu Sans',sans-serif" font-size="23" fill="#7FA8A0">affiliatehub.pro · Simulated earnings. No real money at risk.</text>

  <!-- ===== Floating game card ===== -->
  <rect x="1036" y="146" width="440" height="556" rx="40" fill="#14514E" opacity="0.75"/>
  <g filter="url(#twCard)">
    <rect x="992" y="112" width="440" height="596" rx="40" fill="#FFFFFF"/>
  </g>
  <circle cx="1042" cy="164" r="9" fill="#F2682A"/>
  <circle cx="1070" cy="164" r="9" fill="#F0A118"/>
  <circle cx="1098" cy="164" r="9" fill="#0B6E6B"/>
  <rect x="1300" y="142" width="104" height="40" rx="20" fill="#0B2E2D"/>
  <text x="1352" y="169" text-anchor="middle" font-family="'Space Grotesk',Arial,'DejaVu Sans',sans-serif" font-size="21" font-weight="700" fill="#7CF0D4">DAY 12</text>

  <text x="1034" y="292" font-family="'Space Grotesk',Arial,'DejaVu Sans',sans-serif" font-size="82" font-weight="700" fill="#16232A">$1,248</text>
  <text x="1038" y="326" font-family="'IBM Plex Sans',Arial,'DejaVu Sans',sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#0B6E6B">BEST DAY · +$248</text>

  <rect x="1038" y="424" width="72" height="76" rx="18" fill="#E9DFD2"/>
  <rect x="1122" y="388" width="72" height="112" rx="18" fill="url(#twTeal)"/>
  <rect x="1206" y="410" width="72" height="90" rx="18" fill="#E9DFD2"/>
  <rect x="1290" y="360" width="72" height="140" rx="18" fill="#0B2E2D"/>
  <path d="M1046 424 C 1110 402, 1164 410, 1216 382 C 1258 358, 1286 348, 1330 344" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
  <path d="M1300 326 H1334 V360" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1046 424 C 1110 402, 1164 410, 1216 382 C 1258 358, 1286 348, 1330 344" fill="none" stroke="url(#twOrange)" stroke-width="14" stroke-linecap="round"/>
  <path d="M1300 326 H1334 V360" fill="none" stroke="url(#twOrange)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="1038" y="548" font-family="'Space Grotesk',Arial,'DejaVu Sans',sans-serif" font-size="23" font-weight="700" letter-spacing="2" fill="#16232A">LEVEL 5</text>
  <text x="1362" y="548" text-anchor="end" font-family="'IBM Plex Sans',Arial,'DejaVu Sans',sans-serif" font-size="20" font-weight="700" fill="#7A8791">72%</text>
  <rect x="1038" y="564" width="324" height="28" rx="14" fill="#EFE6D4"/>
  <rect x="1038" y="564" width="227" height="28" rx="14" fill="url(#twOrange)"/>
  <circle cx="1265" cy="578" r="18" fill="#ffffff" stroke="#F0A118" stroke-width="5"/>
  <path d="M1265 569 l2.6 5.2 5.8 0.8 -4.2 4.1 1 5.8 -5.2 -2.7 -5.2 2.7 1 -5.8 -4.2 -4.1 5.8 -0.8 z" fill="#F2682A"/>

  <g transform="translate(1062 650)">
    <path d="M0 -20 C 9 -9, 15 -3, 15 6 A15 15 0 1 1 -15 6 C-15 -3 -8 -7 -5 -14 C-2 -9 0 -8 0 -3 C1 -8 -2 -14 0 -20 Z" fill="#F2682A"/>
    <path d="M0 -7 C 5 -1, 7 1, 7 6 A7 7 0 1 1 -7 6 C-7 1 -4 0 -2 -4 C-1 -1 0 -1 0 1 C1 -1 -1 -4 0 -7 Z" fill="#FFD97A"/>
  </g>
  <text x="1090" y="658" font-family="'IBM Plex Sans',Arial,'DejaVu Sans',sans-serif" font-size="24" font-weight="700" fill="#16232A">3-day streak</text>
  <circle cx="1324" cy="650" r="18" fill="url(#twGold)" stroke="#C77F0A" stroke-width="2.5"/>
  <text x="1324" y="659" text-anchor="middle" font-family="'Space Grotesk',Arial,'DejaVu Sans',sans-serif" font-size="20" font-weight="700" fill="#7A4A00">$</text>

  <!-- Floating coin -->
  <circle cx="1462" cy="168" r="58" fill="url(#twGold)" stroke="#ffffff" stroke-width="7"/>
  <circle cx="1462" cy="168" r="38" fill="none" stroke="#B97A0B" stroke-width="3.5" stroke-opacity="0.55"/>
  <text x="1462" y="189" text-anchor="middle" font-family="'Space Grotesk',Arial,'DejaVu Sans',sans-serif" font-size="54" font-weight="700" fill="#7A4A00">$</text>

  <!-- Sparkles -->
  <path d="M940 700 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 z" fill="#F7B32B"/>
  <path d="M1490 700 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 z" fill="#7CF0D4"/>
  <path d="M928 92 l4.5 11 11 4.5 -11 4.5 -4.5 11 -4.5 -11 -11 -4.5 11 -4.5 z" fill="#F7B32B" opacity="0.85"/>
</svg>
